name: Demo Reset

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/demo.yml
      - .github/scripts/reset_demo.py
      - .github/scripts/test_reset_demo.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test demo reset failure recovery
        run: python3 -m unittest discover -s .github/scripts -p 'test_reset_demo.py' -v

  reset:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: casaos-demo-us-west-2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: us-west-2
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "3"
      DEMO_SNAPSHOT_NAME: CasaOS-v0.4.4-3-Demo-1700132299
      DEMO_STATIC_IP_NAME: CasaOS-Demo-IP
      DEMO_AVAILABILITY_ZONE: us-west-2a
      DEMO_BUNDLE_ID: medium_2_0
      DEMO_HOST: demo.casaos.io
      DEMO_INSTANCE_NAME: CasaOS-Demo-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure AWS credentials from Test account
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Rebuild, verify, switch traffic, and retire old demo instances
        run: python3 .github/scripts/reset_demo.py
      - name: Demo Reset Error Handling
        if: failure()
        env:
          SSH_ROBOT_URL: ${{ secrets.SSH_ROBOT_URL }}
        run: |
          if [ -n "$SSH_ROBOT_URL" ]; then
            curl --fail --silent --show-error --max-time 15 \
              -H 'Content-Type: application/json' \
              -d '{"msg_type":"text","content":{"text":"Demo Reset Error. Check the GitHub Actions run for recovery details."}}' \
              "$SSH_ROBOT_URL"
          fi
            
            
